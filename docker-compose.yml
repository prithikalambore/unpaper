# Local development / self-hosting.
#   docker compose up --build        -> http://localhost:3000
#   FRONTEND_PORT=3002 docker compose up --build   (if port 3000 is taken)
#
# Only the frontend is published. The browser talks to Next.js, which proxies
# /api/* to the backend over the private compose network.
services:
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_PAGES: ${MAX_PAGES:-300}
      CONVERSION_TIMEOUT_SECONDS: ${CONVERSION_TIMEOUT_SECONDS:-300}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-20}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-600}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
      WORK_DIR: /tmp/pdf2word
    expose:
      - "8000"
    # Uploaded and converted files live only in RAM-backed tmpfs, never on disk.
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
